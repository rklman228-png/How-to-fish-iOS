<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="screen-orientation" content="landscape" />
<title>How to Fish — Controls Prototype v2</title>
<style>
:root{
  --ink:#11100f;
  --paper:rgba(242,235,213,.80);
  --paper2:rgba(255,250,230,.92);
  --shadow:rgba(0,0,0,.38);
  --line:rgba(17,16,15,.78);
  --ghost:rgba(19,18,16,.26);
  --pressed:rgba(255,244,194,.98);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;touch-action:none}
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#111;font-family:-apple-system,BlinkMacSystemFont,"Arial Rounded MT Bold","Trebuchet MS",sans-serif}
body::before{
  content:"";position:fixed;inset:-3%;
  background:
    linear-gradient(rgba(8,10,8,.06),rgba(8,10,8,.12)),
    url('https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/4001890/48f6817fe466a7c9666605527558bf1fac48d0d2/ss_48f6817fe466a7c9666605527558bf1fac48d0d2.1920x1080.jpg') center/cover no-repeat;
  filter:saturate(.94) contrast(1.03);
  transform:scale(1.02);
}
#hud{position:fixed;inset:0;padding:max(12px,env(safe-area-inset-top)) max(18px,env(safe-area-inset-right)) max(12px,env(safe-area-inset-bottom)) max(18px,env(safe-area-inset-left));}

/* Mobile controls deliberately use the same flat material language as the PC hotbar slots.
   The hotbar itself stays visually untouched; on the real port it only receives touch hitboxes. */
.btn{
  position:absolute;display:grid;place-items:center;
  width:58px;height:58px;
  border:1.6px solid rgba(17,16,15,.70);
  border-radius:12px;
  background:rgba(240,233,210,.64);
  box-shadow:0 3px 0 rgba(20,18,16,.48),0 4px 10px rgba(0,0,0,.20);
  color:#171512;
  transform:translateY(0) scale(1);
  transition:transform .06s ease,background .06s ease,box-shadow .06s ease;
  backdrop-filter:blur(.7px);
}
.btn::after{display:none}
.btn.pressed{
  transform:translateY(2px);
  background:rgba(255,244,194,.94);
  box-shadow:0 1px 0 rgba(20,18,16,.48),0 2px 5px rgba(0,0,0,.18);
}
.btn .key{position:absolute;left:6px;top:5px;font-size:9px;line-height:1;font-weight:900;opacity:.60;letter-spacing:-.02em}
.btn svg{width:28px;height:28px;overflow:visible;stroke:currentColor;fill:none;stroke-width:2.15;stroke-linecap:round;stroke-linejoin:round}
.btn.small{width:45px;height:45px;border-radius:10px}
.btn.small svg{width:22px;height:22px}
.btn.mini{width:39px;height:39px;border-radius:9px}
.btn.mini svg{width:19px;height:19px}

#joy{position:absolute;left:30px;bottom:28px;width:132px;height:132px;border-radius:50%;background:rgba(12,12,10,.20);border:2px solid rgba(245,239,218,.62);box-shadow:inset 0 0 0 7px rgba(0,0,0,.08),0 8px 22px rgba(0,0,0,.23)}
#joy::before,#joy::after{content:"";position:absolute;left:50%;top:50%;background:rgba(245,239,218,.28);transform:translate(-50%,-50%)}
#joy::before{width:2px;height:88px}#joy::after{width:88px;height:2px}
#knob{position:absolute;left:50%;top:50%;width:61px;height:61px;border-radius:50%;transform:translate(-50%,-50%);background:rgba(240,233,210,.72);border:1.6px solid rgba(17,16,15,.70);box-shadow:0 3px 0 rgba(20,18,16,.42),0 4px 10px rgba(0,0,0,.20)}

#lookZone{position:absolute;left:42%;right:0;top:0;bottom:0;}

#primary{right:38px;bottom:42px;width:76px;height:76px;border-radius:15px}
#secondary{right:122px;bottom:86px;width:62px;height:62px;border-radius:13px}
#interact{right:48px;bottom:133px}
#dropWrap{position:absolute;right:127px;bottom:156px;width:69px;height:69px}
#drop{inset:6px;width:57px;height:57px;border-radius:12px}
#dropRing{position:absolute;inset:0;border-radius:50%;background:conic-gradient(rgba(255,239,145,.97) calc(var(--p,0)*1turn),rgba(245,239,218,.19) 0);-webkit-mask:radial-gradient(circle,transparent 59%,#000 61%);mask:radial-gradient(circle,transparent 59%,#000 61%);opacity:0;transition:opacity .1s ease;filter:drop-shadow(0 2px 2px rgba(0,0,0,.35))}
#dropWrap.charging #dropRing{opacity:1}

#jump{right:207px;bottom:38px}
#sprint{left:164px;bottom:104px}
#crouch{left:164px;bottom:41px}

#utility{position:absolute;right:23px;top:19px;display:flex;gap:9px;align-items:flex-start}
#utility .btn{position:relative;left:auto;right:auto;top:auto;bottom:auto}
#mic{margin-left:4px}

#skinPrev{left:21px;top:21px}#skinNext{left:68px;top:21px}

#hotbar{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);display:flex;gap:5px;padding:5px 7px;border-radius:17px;background:rgba(10,10,9,.25);border:1px solid rgba(245,239,218,.22);backdrop-filter:blur(2px)}
.slot{position:relative;width:35px;height:35px;border-radius:10px;background:rgba(240,233,210,.64);border:1.6px solid rgba(17,16,15,.70);box-shadow:0 3px 0 rgba(20,18,16,.48),0 4px 10px rgba(0,0,0,.20);display:grid;place-items:center;color:#171512;font-weight:900;font-size:12px;transition:.06s}
.slot.pressed{transform:translateY(2px);background:rgba(255,244,194,.94);box-shadow:0 1px 0 rgba(20,18,16,.48)}
.slot .num{opacity:.77}
#noneSlot{width:35px}

#gestureDot{position:absolute;width:19px;height:19px;border-radius:50%;border:2px solid rgba(255,247,220,.9);background:rgba(10,10,8,.15);opacity:0;pointer-events:none;transform:translate(-50%,-50%);box-shadow:0 2px 8px rgba(0,0,0,.35)}
#gestureDot.show{opacity:.7}

@media(max-height:360px){
  #joy{width:116px;height:116px;left:25px;bottom:22px}#knob{width:54px;height:54px}
  .btn{width:52px;height:52px}.btn svg{width:25px;height:25px}
  #primary{width:68px;height:68px;right:33px;bottom:34px}
  #secondary{right:107px;bottom:72px;width:57px;height:57px}
  #interact{right:40px;bottom:113px}
  #dropWrap{right:111px;bottom:132px}
  #jump{right:183px;bottom:31px}
  #sprint{left:145px;bottom:90px}#crouch{left:145px;bottom:34px}
  #hotbar{bottom:10px}.slot{width:31px;height:31px}
}
</style>
</head>
<body>
<div id="hud">
  <div id="lookZone"></div><div id="gestureDot"></div>

  <div id="skinPrev" class="btn mini tap" data-action="PlayerChangeSkin-">
    <span class="key">Z</span><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>
  </div>
  <div id="skinNext" class="btn mini tap" data-action="PlayerChangeSkin+">
    <span class="key">C</span><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg>
  </div>

  <div id="joy"><div id="knob"></div></div>

  <div id="sprint" class="btn hold" data-action="PlayerSprint">
    <span class="key">SHIFT</span><svg viewBox="0 0 32 32"><path d="M6 21l7-10 4 5 4-6 5 5"/><path d="M9 25h15"/><path d="M20 20l6 5-6 3"/></svg>
  </div>
  <div id="crouch" class="btn hold" data-action="PlayerCrouch">
    <span class="key">CTRL</span><svg viewBox="0 0 32 32"><circle cx="18" cy="8" r="3"/><path d="M17 12l-5 6 5 3 6-1"/><path d="M12 18l-5 7"/><path d="M17 21l3 6"/></svg>
  </div>

  <div id="jump" class="btn tap" data-action="PlayerJump">
    <span class="key">SPACE</span><svg viewBox="0 0 32 32"><path d="M16 26V7"/><path d="M9 14l7-7 7 7"/></svg>
  </div>

  <div id="primary" class="btn hold" data-action="PlayerLeftClick">
    <span class="key">LMB</span><svg viewBox="0 0 32 32"><rect x="9" y="4" width="14" height="24" rx="7"/><path d="M16 4v9"/><path d="M9 13h7"/></svg>
  </div>
  <div id="secondary" class="btn hold" data-action="PlayerRightClick">
    <span class="key">RMB</span><svg viewBox="0 0 32 32"><rect x="9" y="4" width="14" height="24" rx="7"/><path d="M16 4v9"/><path d="M16 13h7"/></svg>
  </div>
  <div id="interact" class="btn tap" data-action="PlayerPickUp">
    <span class="key">E</span><svg viewBox="0 0 32 32"><path d="M9 16v-5a2 2 0 0 1 4 0v4V8a2 2 0 0 1 4 0v7V9a2 2 0 0 1 4 0v7-4a2 2 0 0 1 4 0v7c0 6-4 9-9 9h-1c-4 0-7-2-9-6l-2-4a2 2 0 0 1 3-2l2 2"/></svg>
  </div>
  <div id="dropWrap">
    <div id="dropRing"></div>
    <div id="drop" class="btn" data-action="PlayerDrop">
      <span class="key">Q</span><svg viewBox="0 0 32 32"><path d="M7 23c5-1 7-4 10-7"/><path d="M13 10l5 6-6 5"/><path d="M19 8l6-2-2 6"/></svg>
    </div>
  </div>

  <div id="utility">
    <div class="btn small tap" data-action="WeaponInspect"><span class="key">F</span><svg viewBox="0 0 32 32"><path d="M3 16s5-8 13-8 13 8 13 8-5 8-13 8S3 16 3 16z"/><circle cx="16" cy="16" r="4"/></svg></div>
    <div class="btn small tap" data-action="WeaponReload"><span class="key">R</span><svg viewBox="0 0 32 32"><path d="M25 12a10 10 0 1 0 1 8"/><path d="M25 5v7h-7"/></svg></div>
    <div class="btn small tap" data-action="ChangeBait"><span class="key">B</span><svg viewBox="0 0 32 32"><path d="M20 5v12a7 7 0 1 1-7-7"/><path d="M20 5l5 4"/><path d="M13 23c2 0 4-1 4-3"/></svg></div>
    <div class="btn small tap" data-action="PlayerTab"><span class="key">TAB</span><svg viewBox="0 0 32 32"><path d="M5 7h9a4 4 0 0 1 4 4v15a4 4 0 0 0-4-4H5z"/><path d="M27 7h-5a4 4 0 0 0-4 4v15a4 4 0 0 1 4-4h5z"/></svg></div>
    <div id="mic" class="btn small hold" data-action="PushToTalk"><span class="key">V</span><svg viewBox="0 0 32 32"><rect x="12" y="4" width="8" height="15" rx="4"/><path d="M7 15a9 9 0 0 0 18 0"/><path d="M16 24v5"/></svg></div>
    <div class="btn small tap" data-action="Pause"><span class="key">ESC</span><svg viewBox="0 0 32 32"><path d="M11 8v16M21 8v16"/></svg></div>
  </div>

  <div id="hotbar">
    <div id="noneSlot" class="slot tap" data-action="InventoryNone"><span class="num">X</span></div>
    <div class="slot tap" data-action="Inventory1"><span class="num">1</span></div>
    <div class="slot tap" data-action="Inventory2"><span class="num">2</span></div>
    <div class="slot tap" data-action="Inventory3"><span class="num">3</span></div>
    <div class="slot tap" data-action="Inventory4"><span class="num">4</span></div>
    <div class="slot tap" data-action="Inventory5"><span class="num">5</span></div>
    <div class="slot tap" data-action="Inventory6"><span class="num">6</span></div>
    <div class="slot tap" data-action="Inventory7"><span class="num">7</span></div>
    <div class="slot tap" data-action="Inventory8"><span class="num">8</span></div>
    <div class="slot tap" data-action="Inventory9"><span class="num">9</span></div>
  </div>
</div>
<script>
const activePointers=new Map();
const fire=(el,type,extra={})=>{ window.__lastAction={action:el?.dataset?.action||'',type,...extra,time:performance.now()}; };

for(const el of document.querySelectorAll('.tap')){
  el.addEventListener('pointerdown',e=>{e.preventDefault();el.setPointerCapture(e.pointerId);el.classList.add('pressed');fire(el,'press');});
  const up=e=>{el.classList.remove('pressed');fire(el,'tap');};
  el.addEventListener('pointerup',up);el.addEventListener('pointercancel',()=>el.classList.remove('pressed'));
}
for(const el of document.querySelectorAll('.hold')){
  el.addEventListener('pointerdown',e=>{e.preventDefault();el.setPointerCapture(e.pointerId);el.classList.add('pressed');fire(el,'started');});
  const end=e=>{el.classList.remove('pressed');fire(el,'canceled');};
  el.addEventListener('pointerup',end);el.addEventListener('pointercancel',end);
}

// Q / PlayerDrop: the binary contains DropInput + DropInputCanceled,
// _isHoldingDrop, _startDropForceDelay, _timeUntilMaxDropForce and DropUI methods.
const drop=document.getElementById('drop'),dw=document.getElementById('dropWrap');
let dropStart=0,dropRAF=0;
const dropDelay=180,dropFill=900; // visual prototype timing only; gameplay values remain data-driven later.
function updateDrop(){
  const t=performance.now()-dropStart;
  if(t>dropDelay){dw.classList.add('charging');const p=Math.min(1,(t-dropDelay)/dropFill);dw.style.setProperty('--p',p);fire(drop,'hold',{charge:p});}
  dropRAF=requestAnimationFrame(updateDrop);
}
drop.addEventListener('pointerdown',e=>{e.preventDefault();drop.setPointerCapture(e.pointerId);drop.classList.add('pressed');dropStart=performance.now();dw.style.setProperty('--p',0);fire(drop,'started');dropRAF=requestAnimationFrame(updateDrop);});
function endDrop(){
  cancelAnimationFrame(dropRAF);const held=performance.now()-dropStart;const charged=dw.classList.contains('charging');drop.classList.remove('pressed');dw.classList.remove('charging');dw.style.setProperty('--p',0);fire(drop,charged?'release-charged':'tap',{heldMs:held});
}
drop.addEventListener('pointerup',endDrop);drop.addEventListener('pointercancel',endDrop);

// Movement joystick -> PlayerMove Vector2
const joy=document.getElementById('joy'),knob=document.getElementById('knob');let joyId=null;
function joyMove(e){const r=joy.getBoundingClientRect();const cx=r.left+r.width/2,cy=r.top+r.height/2;let dx=e.clientX-cx,dy=e.clientY-cy;const max=r.width*.31;const d=Math.hypot(dx,dy)||1;if(d>max){dx*=max/d;dy*=max/d}knob.style.transform=`translate(calc(-50% + ${dx}px),calc(-50% + ${dy}px))`;window.__lastAction={action:'PlayerMove',type:'value',x:dx/max,y:-dy/max,time:performance.now()};}
joy.addEventListener('pointerdown',e=>{joyId=e.pointerId;joy.setPointerCapture(e.pointerId);joyMove(e)});joy.addEventListener('pointermove',e=>{if(e.pointerId===joyId)joyMove(e)});function joyEnd(e){if(e.pointerId!==joyId)return;joyId=null;knob.style.transform='translate(-50%,-50%)';window.__lastAction={action:'PlayerMove',type:'canceled',x:0,y:0,time:performance.now()};}joy.addEventListener('pointerup',joyEnd);joy.addEventListener('pointercancel',joyEnd);

// Right-side drag -> PlayerLook Vector2, intentionally almost invisible.
const look=document.getElementById('lookZone'),dot=document.getElementById('gestureDot');let lookId=null,lx=0,ly=0;
look.addEventListener('pointerdown',e=>{if(e.target.closest('.btn,.slot,#hotbar'))return;lookId=e.pointerId;look.setPointerCapture(e.pointerId);lx=e.clientX;ly=e.clientY;dot.style.left=e.clientX+'px';dot.style.top=e.clientY+'px';dot.classList.add('show');});
look.addEventListener('pointermove',e=>{if(e.pointerId!==lookId)return;const dx=e.clientX-lx,dy=e.clientY-ly;lx=e.clientX;ly=e.clientY;dot.style.left=e.clientX+'px';dot.style.top=e.clientY+'px';window.__lastAction={action:'PlayerLook',type:'delta',x:dx,y:dy,time:performance.now()};});
function endLook(e){if(e.pointerId!==lookId)return;lookId=null;dot.classList.remove('show');window.__lastAction={action:'PlayerLook',type:'canceled',x:0,y:0,time:performance.now()};}look.addEventListener('pointerup',endLook);look.addEventListener('pointercancel',endLook);

// Hotbar horizontal swipe -> InventoryScroll, buttons -> Inventory1..9/None.
const hotbar=document.getElementById('hotbar');let hbId=null,hbX=0;
hotbar.addEventListener('pointerdown',e=>{hbId=e.pointerId;hbX=e.clientX});hotbar.addEventListener('pointerup',e=>{if(e.pointerId!==hbId)return;const dx=e.clientX-hbX;if(Math.abs(dx)>40)window.__lastAction={action:'InventoryScroll',type:'axis',value:dx>0?-1:1,time:performance.now()};hbId=null;});

document.addEventListener('contextmenu',e=>e.preventDefault());
</script>
</body>
</html>
