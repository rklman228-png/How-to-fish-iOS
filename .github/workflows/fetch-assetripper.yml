name: Fetch AssetRipper tool

on:
  push:
    branches: [ port-dev ]
    paths:
      - '.github/workflows/fetch-assetripper.yml'

concurrency:
  group: how-to-fish-ios-build
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Download AssetRipper 1.3.14 Linux x64
        run: |
          set -euo pipefail
          curl -fL --retry 3 \
            'https://github.com/AssetRipper/AssetRipper/releases/download/1.3.14/AssetRipper_linux_x64.zip' \
            -o AssetRipper_linux_x64.zip
          unzip -t AssetRipper_linux_x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: AssetRipper-linux-x64-1.3.14
          path: AssetRipper_linux_x64.zip
          compression-level: 0
