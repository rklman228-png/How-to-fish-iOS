name: Build full How to Fish iOS port

on:
  push:
    branches: [ ci-build ]
    paths:
      - '.ci/run-full-ios-port-*'

concurrency:
  group: how-to-fish-ios-build
  cancel-in-progress: false

jobs:
  export-xcode:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Install reconstruction dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y aria2 unzip xz-utils patch curl python3-pip
          python3 -m pip install --break-system-packages lz4

      - name: Reconstruct torrent payload
        shell: bash
        run: |
          set -euo pipefail
          cat porting/payload/game.torrent.gz.b64.part* | base64 -d | gzip -dc > game.torrent
          echo 'f24cb82252acaf8892cedf24197a31f177bacc65e71da9b5a7227d0b61ac8087  game.torrent' | sha256sum -c -

      - name: Fetch original game build
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p game-download
          aria2c --seed-time=0 --file-allocation=none --summary-interval=30 --dir="$PWD/game-download" game.torrent
          GAME_EXE=$(find "$PWD/game-download" -type f -name 'How to Fish.exe' -print -quit)
          test -n "$GAME_EXE"
          GAME_ROOT=$(dirname "$GAME_EXE")
          echo "GAME_ROOT=$GAME_ROOT" >> "$GITHUB_ENV"
          echo "Game root: $GAME_ROOT"
          du -sh "$GAME_ROOT"

      - name: Download AssetRipper 1.3.14
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 5 --retry-delay 3 \
            'https://github.com/AssetRipper/AssetRipper/releases/download/1.3.14/AssetRipper_linux_x64.zip' \
            -o "$RUNNER_TEMP/AssetRipper.zip"
          mkdir -p "$RUNNER_TEMP/AssetRipper"
          unzip -q "$RUNNER_TEMP/AssetRipper.zip" -d "$RUNNER_TEMP/AssetRipper"
          chmod +x "$RUNNER_TEMP/AssetRipper/AssetRipper.GUI.Free"

      - name: Export Windows build back to Unity project
        shell: bash
        run: |
          set -euo pipefail
          AR="$RUNNER_TEMP/AssetRipper/AssetRipper.GUI.Free"
          EXPORT_ROOT="$RUNNER_TEMP/HowToFishUnityExport"
          "$AR" --headless --port 39999 --log-path "$GITHUB_WORKSPACE/assetripper.log" >"$GITHUB_WORKSPACE/assetripper.stdout" 2>&1 &
          AR_PID=$!
          trap 'kill $AR_PID 2>/dev/null || true' EXIT
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:39999/ >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS -L -X POST --data-urlencode "path=$GAME_ROOT" http://127.0.0.1:39999/LoadFolder >/dev/null
          rm -rf "$EXPORT_ROOT"
          mkdir -p "$EXPORT_ROOT"
          curl -fsS -L -X POST --data-urlencode "path=$EXPORT_ROOT" http://127.0.0.1:39999/Export/UnityProject >/dev/null
          kill "$AR_PID" 2>/dev/null || true
          wait "$AR_PID" 2>/dev/null || true
          trap - EXIT
          PROJECT="$EXPORT_ROOT/ExportedProject"
          test -f "$PROJECT/ProjectSettings/ProjectVersion.txt"
          echo "UNITY_PROJECT=$PROJECT" >> "$GITHUB_ENV"
          du -sh "$PROJECT"
          find "$PROJECT/Assets/Scripts" -name '*.cs' | wc -l

      - name: Apply preserved iOS port patch
        shell: bash
        run: |
          set -euo pipefail
          cat porting/payload/code.patch.gz.b64.part* | base64 -d | gzip -dc > "$RUNNER_TEMP/howtofish-ios.patch"
          cd "$UNITY_PROJECT"
          patch -p1 --forward < "$RUNNER_TEMP/howtofish-ios.patch"
          test -f Assets/HowToFishMobile/Editor/IOSBuild.cs
          test -f Assets/HowToFishMobile/Scripts/MobileControlsBootstrap.cs

      - name: Restore all localization tables
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$UNITY_PROJECT/Assets/StreamingAssets"
          python3 porting/extract_localization.py "$GAME_ROOT" "$UNITY_PROJECT/Assets/StreamingAssets/HowToFishLocalization.json" | tee "$GITHUB_WORKSPACE/localization.log"
          grep -q 'MISSING 0' "$GITHUB_WORKSPACE/localization.log"

      - name: Download exact Unity 6000.4.4f1 with iOS support
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://download.unity3d.com/download_unity/360f97ecca93'
          curl -fL --retry 5 --retry-delay 3 --progress-bar \
            "$BASE/LinuxEditorInstaller/Unity-6000.4.4f1.tar.xz" \
            -o "$RUNNER_TEMP/unity-editor.tar.xz"
          curl -fL --retry 5 --retry-delay 3 --progress-bar \
            "$BASE/LinuxEditorTargetInstaller/UnitySetup-iOS-Support-for-Editor-6000.4.4f1.tar.xz" \
            -o "$RUNNER_TEMP/unity-ios.tar.xz"
          mkdir -p "$RUNNER_TEMP/unity"
          tar -xJf "$RUNNER_TEMP/unity-editor.tar.xz" -C "$RUNNER_TEMP/unity"
          tar -xJf "$RUNNER_TEMP/unity-ios.tar.xz" -C "$RUNNER_TEMP/unity"
          test -x "$RUNNER_TEMP/unity/Editor/Unity"

      - name: Export iOS Xcode project with Unity
        shell: bash
        run: |
          set -o pipefail
          UNITY="$RUNNER_TEMP/unity/Editor/Unity"
          "$UNITY" \
            -batchmode -nographics -force-free -accept-apiupdate -quit \
            -projectPath "$UNITY_PROJECT" \
            -executeMethod HowToFish.Mobile.Editor.IOSBuild.Build \
            -logFile - 2>&1 | tee "$GITHUB_WORKSPACE/unity-build.log"
          rc=${PIPESTATUS[0]}
          test "$rc" -eq 0
          test -f "$UNITY_PROJECT/build/iOS/Unity-iPhone.xcodeproj/project.pbxproj"
          du -sh "$UNITY_PROJECT/build/iOS"

      - name: Upload Unity diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-port-diagnostics
          path: |
            assetripper.log
            assetripper.stdout
            localization.log
            unity-build.log
          if-no-files-found: ignore

      - name: Upload Xcode export
        uses: actions/upload-artifact@v4
        with:
          name: how-to-fish-ios-xcode
          path: ${{ env.UNITY_PROJECT }}/build/iOS
          compression-level: 0

  build-ipa:
    needs: export-xcode
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: how-to-fish-ios-xcode
          path: xcode

      - name: Build unsigned device app
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -project xcode/Unity-iPhone.xcodeproj \
            -scheme Unity-iPhone \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$PWD/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            ENABLE_BITCODE=NO \
            build | tee xcodebuild.log
          APP=$(find "$PWD/DerivedData/Build/Products" -type d -name '*.app' -not -path '*Index.noindex*' -print -quit)
          test -n "$APP"
          echo "APP=$APP" >> "$GITHUB_ENV"
          du -sh "$APP"

      - name: Package IPA
        shell: bash
        run: |
          set -euo pipefail
          rm -rf Payload How-to-Fish-iOS-v1.0.9-unsigned.ipa
          mkdir Payload
          cp -R "$APP" Payload/
          /usr/bin/zip -qry How-to-Fish-iOS-v1.0.9-unsigned.ipa Payload
          ls -lh How-to-Fish-iOS-v1.0.9-unsigned.ipa
          shasum -a 256 How-to-Fish-iOS-v1.0.9-unsigned.ipa | tee ipa.sha256

      - name: Upload Xcode log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcode-build-log
          path: xcodebuild.log
          if-no-files-found: ignore

      - name: Upload final IPA
        uses: actions/upload-artifact@v4
        with:
          name: How-to-Fish-iOS-v1.0.9-unsigned-ipa
          path: |
            How-to-Fish-iOS-v1.0.9-unsigned.ipa
            ipa.sha256
          compression-level: 0
