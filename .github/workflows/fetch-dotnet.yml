name: Fetch dotnet tool

on:
  push:
    branches: [ port-dev ]
    paths:
      - '.github/workflows/fetch-dotnet.yml'

concurrency:
  group: how-to-fish-ios-build
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.424'
      - name: Package SDK
        shell: bash
        run: |
          set -euo pipefail
          DOTNET_ROOT_REAL="$(dirname "$(readlink -f "$(command -v dotnet)")")"
          echo "$DOTNET_ROOT_REAL"
          tar -C "$DOTNET_ROOT_REAL" -czf dotnet-sdk-linux-x64.tgz .
          ./"$(basename "$(command -v dotnet)")" --info || true
      - uses: actions/upload-artifact@v4
        with:
          name: dotnet-sdk-linux-x64
          path: dotnet-sdk-linux-x64.tgz
          compression-level: 0
