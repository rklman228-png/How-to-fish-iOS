name: Build unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: [ main ]

concurrency:
  group: how-to-fish-ios-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Build device app without signing
        run: |
          set -euo pipefail
          xcodebuild \
            -project HowFishControlsDemo.xcodeproj \
            -target HowFishControlsDemo \
            -configuration Release \
            -sdk iphoneos \
            CONFIGURATION_BUILD_DIR="$PWD/build/Release-iphoneos" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        run: |
          set -euo pipefail
          APP=$(find "$PWD/build/Release-iphoneos" -maxdepth 1 -name '*.app' -type d | head -1)
          test -n "$APP"
          rm -rf Payload HowFishControlsDemo-unsigned.ipa
          mkdir Payload
          cp -R "$APP" Payload/
          zip -qry HowFishControlsDemo-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: HowFishControlsDemo-unsigned-ipa
          path: HowFishControlsDemo-unsigned.ipa
