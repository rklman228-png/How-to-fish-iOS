name: Split Unity editor artifact

on:
  push:
    branches: [ ci-build ]
    paths:
      - '.github/workflows/split-unity-editor.yml'

concurrency:
  group: how-to-fish-ios-build
  cancel-in-progress: false

jobs:
  split:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Download exact Unity editor
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://download.unity3d.com/download_unity/360f97ecca93'
          curl -fL --retry 5 --retry-delay 3 --progress-bar \
            "$BASE/LinuxEditorInstaller/Unity-6000.4.4f1.tar.xz" \
            -o Unity-6000.4.4f1.tar.xz
          sha256sum Unity-6000.4.4f1.tar.xz | tee Unity-6000.4.4f1.sha256
          split -b 400000000 -d -a 2 --additional-suffix=.part Unity-6000.4.4f1.tar.xz unity-editor-
          ls -lh unity-editor-*.part
      - uses: actions/upload-artifact@v4
        with: {name: unity-editor-00, path: unity-editor-00.part, compression-level: 0}
      - uses: actions/upload-artifact@v4
        with: {name: unity-editor-01, path: unity-editor-01.part, compression-level: 0}
      - uses: actions/upload-artifact@v4
        with: {name: unity-editor-02, path: unity-editor-02.part, compression-level: 0}
      - uses: actions/upload-artifact@v4
        with: {name: unity-editor-03, path: unity-editor-03.part, compression-level: 0}
      - uses: actions/upload-artifact@v4
        with: {name: unity-editor-04, path: unity-editor-04.part, compression-level: 0}
      - uses: actions/upload-artifact@v4
        with: {name: unity-editor-05, path: unity-editor-05.part, compression-level: 0}
      - uses: actions/upload-artifact@v4
        with: {name: unity-editor-06, path: unity-editor-06.part, compression-level: 0}
      - uses: actions/upload-artifact@v4
        with: {name: unity-editor-07, path: unity-editor-07.part, compression-level: 0}
      - uses: actions/upload-artifact@v4
        with: {name: unity-editor-08, path: unity-editor-08.part, compression-level: 0}
      - uses: actions/upload-artifact@v4
        with: {name: unity-editor-09, path: unity-editor-09.part, compression-level: 0}
      - uses: actions/upload-artifact@v4
        with:
          name: unity-editor-10
          path: unity-editor-10.part
          compression-level: 0
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: unity-editor-11
          path: unity-editor-11.part
          compression-level: 0
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with: {name: unity-editor-sha256, path: Unity-6000.4.4f1.sha256}
